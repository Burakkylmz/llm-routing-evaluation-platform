[project]
name = "llm-routing-evaluation-platform"
version = "0.1.0"
description = "Privacy-conscious evaluation of LLM routing strategies on controlled workloads"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = ["pydantic>=2.10,<3", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.scripts]
llm-routing-eval = "llm_routing_eval.cli.app:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llm_routing_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
